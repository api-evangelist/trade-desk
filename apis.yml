    type: SDKs
    name: GTM Client-Side Template
  - url: https://github.com/TheTradeDesk/conversion-events-server-side-googletagmanager
    type: SDKs
    name: GTM Server-Side Template
  description: >-
    Server-side and client-side conversion event ingestion (Apache 2.0 Google Tag Manager templates) for
    capturing high-fidelity attribution signals in a cookie-deprecated environment. Pairs with UID2 for
    identity resolution.
- aid: trade-desk:trade-desk-uid2-api
  name: Unified ID 2.0 (UID2)
  tags:
  - Identity
  - Privacy
  - Open Source
  - IAB Tech Lab
  humanURL: https://unifiedid.com
  baseURL: https://prod.uidapi.com
  properties:
  - url: https://unifiedid.com
    type: Portal
  - url: https://unifiedid.com/docs/intro
    type: Documentation
  - url: https://github.com/IABTechLab/uid2docs
    type: Documentation
    name: UID2 Documentation Repository
  - url: https://github.com/IABTechLab/uid2-operator
    type: SDKs
    name: UID2 Operator Reference Implementation
  description: >-
    Unified ID 2.0 is an open-source, deterministic identity framework seeded by The Trade Desk and now
    governed by the IAB Tech Lab. UID2 resolves hashed email addresses and phone numbers into rotating
    tokens that publishers, DSPs, SSPs, and measurement vendors can use for addressable advertising without
    third-party cookies. The EUID variant provides a GDPR-aligned European deployment.
