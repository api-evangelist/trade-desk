  description: The request did not contain all required input, had malformed syntax, or the included input
    failed validation.
- status: 401
  message: Unauthorized
  description: The user does not have valid authentication credentials to access the requested resource.
- status: 403
  message: Forbidden
  description: The user does not have access to this endpoint or entity; or the endpoint or entity does
    not exist.
- status: 404
  message: Not Found
  description: The requested resource has not been found.
- status: 409
  message: Conflict
  description: The request conflicts with the current state of the server.
- status: 410
  message: Gone
  description: The request uses a deprecated endpoint or property.
  note: This is The Trade Desk's deprecation signal in place of RFC 8594 Sunset/Deprecation headers.
- status: 413
  message: Content Too Large
  description: Request payload exceeds the maximum allowed size.
- status: 429
  message: Too Many Requests
  description: The endpoint rate limit was exceeded. Honour Retry-After.
- status: 500
  message: Internal Server Error
  description: The server encountered an unexpected condition.
- status: 503
  message: Service Unavailable
  description: Temporary overload. Use the Retry-After header as guidance on when to retry.
