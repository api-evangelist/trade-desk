format_note: Neither the Platform API nor the Data API uses RFC 9457 application/problem+json. Data API
  errors come back as a proprietary envelope; Platform API errors as a JSON body described only as "a
  JSON body describing the error". The only surface observed returning application/problem+json is the
  OpenTTD documentation content service.
envelope:
  data_api_v2:
    fields:
    - ErrorCode
    - Message
    - FailedLines
    note: v2 returns a consistent envelope across endpoints. v1 (the default) returns FailedLines only
      and varies by endpoint.
  platform_api:
    note: HTTP status code plus a JSON body describing the error.
